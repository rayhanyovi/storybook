services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: storybook, POSTGRES_PASSWORD: storybook, POSTGRES_DB: storybook }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: ./apps/api
    env_file: .env
    depends_on: [db]
    ports: ["3000:3000"]
volumes: { pgdata: {} }
